[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"


[project]
name = "{{ cookiecutter.__package_name }}"
description = "{{ cookiecutter.package_description }}"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["click", "pytask>=0.2"]
authors = [{name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.email }}"}]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "{{ cookiecutter.open_source_license }}"}
classifiers = [
    "Development Status :: 3 - Alpha",
{% if cookiecutter.open_source_license == "MIT" %}
    "License :: OSI Approved :: MIT License",
{% elif cookiecutter.open_source_license == "BSD" %}
    "License :: OSI Approved :: BSD License",
{% elif cookiecutter.open_source_license == "ISC" %}
    "License :: OSI Approved :: ISC License (ISCL)",
{% elif cookiecutter.open_source_license == "Apache Software License 2.0" %}
    "License :: OSI Approved :: Apache Software License",
{% elif cookiecutter.open_source_license == "GNU General Public License v3" %}
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
{% endif %}
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}"
Changelog = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}/blob/main/CHANGES.md"
Documentation = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}"
Github = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}"
Tracker = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}/issues"

[project.entry-points.pytask]
{{ cookiecutter.__package_name }} = "{{ cookiecutter.__package_name }}.plugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.check-manifest]
ignore = ["src/{{ cookiecutter.__package_name }}/_version.py"]

[tool.setuptools_scm]
write_to = "src/{{ cookiecutter.__package_name }}/_version.py"

[dependency-groups]
docs = [
    "furo",
    "ipython",
    "myst-parser",
    "nbsphinx",
    "sphinx",
    "sphinx-click",
    "sphinx-copybutton",
    "sphinx-design>=0.3",
    "sphinx-toolbox",
    "sphinxext-opengraph",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytask-parallel>=0.2",
]
typing = ["ty>=0.0.28"]


[tool.pytask.ini_options]
paths = "./src/{{ cookiecutter.package_name }}"


[tool.ruff]
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"
select = ["ALL"]
fix = true
extend-ignore = [
    # Numpy docstyle
    "D107",
    "D203",
    "D212",
    "D213",
    "D402",
    "D413",
    "D415",
    "D416",
    "D417",
    # Others.
    "D404",  # Do not start module docstring with "This".
    "RET504",  # unnecessary variable assignment before return.
    "S101",  # raise errors for asserts.
    "B905",  # strict parameter for zip that was implemented in py310.
    "I",  # ignore isort
    "FBT",  # flake8-boolean-trap
    "EM",  # flake8-errmsg
    "ANN401",  # flake8-annotate typing.Any
    "PD",  # pandas-vet
    "COM812",  # trailing comma missing, but ruff format takes care of that
]


[tool.ruff.per-file-ignores]
"tests/*" = ["D", "ANN"]


[tool.ruff.pydocstyle]
convention = "numpy"


[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
filterwarnings = [
    "ignore: the imp module is deprecated in favour of importlib",
    "ignore: Using or importing the ABCs from 'collections' instead of",
    "ignore: The (parser|symbol) module is deprecated and will be removed in future",
]
junit_family = "xunit2"
markers = [
    "wip: Tests that are work-in-progress.",
    "unit: Flag for unit tests which target mainly a single function.",
    "integration: Flag for integration tests which may comprise of multiple unit tests.",
    "end_to_end: Flag for tests that cover the whole program.",
]
norecursedirs = [".idea"]


[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
